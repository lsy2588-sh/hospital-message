# 前端 nginx 配置：托管静态文件 + 把 /api 请求转发给后端容器
server {
    # 监听 80 端口（容器内）
    listen 80;
    server_name _;

    # 静态文件根目录（Dockerfile 里复制 dist/ 到这里）
    root /usr/share/nginx/html;
    index index.html;

    # SPA 路由回退：所有非文件路径都返回 index.html，
    # 让 Vue Router 的 /login /patient 等路由由前端处理，而不是 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 把 /api 开头的请求转发给后端容器（docker-compose 里服务名是 backend）
    # 注意 proxy_pass 结尾没有斜杠，会保留完整 /api/xxx 路径
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
